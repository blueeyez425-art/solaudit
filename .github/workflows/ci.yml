name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run core test suite
        run: bun run test

      - name: Build CLI
        run: bun run build:cli

      - name: Build web app
        run: bun run build:web

      - name: Sanity-scan the intentionally vulnerable example
        run: node cli/dist/cli.js examples/vulnerable.rs --min-severity CRITICAL

  self-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Run SolAudit on this repo's own example
        uses: ./
        with:
          path: examples/
          fail-on-findings: 'false'
