name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run core test suite
        run: bun run test

      - name: Build CLI
        run: bun run build:cli

      - name: Build web app
        run: bun run build:web

      - name: Sanity-scan the intentionally vulnerable example (expect non-zero exit)
        run: |
          set +e
          node cli/dist/cli.js examples/vulnerable.rs --min-severity CRITICAL
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Expected the scanner to exit non-zero on CRITICAL findings, but it exited 0."
            exit 1
          fi
          echo "Sanity check passed: scanner correctly flagged CRITICAL findings (exit $code)."

  self-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Run SolAudit on this repo's own example
        uses: ./
        with:
          path: examples/
          fail-on-findings: 'false'
